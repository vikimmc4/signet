/* ---------------- packet construction ---------------- */
function buildPacket(target){
  // Record our own signing before the packet is frozen, so the certificate
  // credits the sender rather than listing them as unsigned.
  const me = A.doc.signers.find(x => x.isMe);
  if (fieldsOf(me.id).some(S.hasValue) && !me.signedAt){
    me.signedAt = new Date().toISOString();
    me.agent = navigator.userAgent;
    me.name = A.doc.sender.name || 'Me';
    me.email = A.doc.sender.email || '';
  }
  const packet = JSON.parse(JSON.stringify(A.doc));
  packet.pdf = A.pdfB64;
  packet.currentSigner = target.id;
  packet.sender = {name: A.doc.sender.name, email: A.doc.sender.email};
  // Strip signers who have nothing to do, but keep already-signed ones for the certificate.
  packet.signers = packet.signers.filter(s => s.signedAt || fieldsOf(s.id).length || s.id === target.id);

  const json  = JSON.stringify(packet);
  const fname = S.safeName(A.doc.title) + ' — signing request.signet.json';
  const blob  = new Blob([json], {type: 'application/json'});
  S.shareOrDownload(fname, blob, 'Signing request')
   .then(how => showSendModal(target, fname, Math.round(json.length / 1024), how));
}

function showSendModal(target, fname, kb, how){
  const url = appUrl();
  const subject = 'Please sign: ' + A.doc.title;
  const body =
    'Hi ' + (target.name ? target.name.split(/\s+/)[0] : '') + ',\n\n' +
    'Please sign "' + A.doc.title + '". It takes about a minute — no account, no app, ' +
    'and it works on a phone.\n\n' +
    '  1. Save the attached file (' + fname + ') to your device.\n' +
    '  2. Open this page in your browser:\n     ' + url + '\n' +
    '  3. Choose "I was asked to sign", then pick the file you just saved.\n' +
    '  4. Tap the highlighted boxes, then press Finish and send the signed PDF back to me.\n\n' +
    (A.doc.message ? A.doc.message + '\n\n' : '') +
    'Thanks,\n' + (A.doc.sender.name || '');
  const gmail = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(target.email) +
    '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  const mailto = 'mailto:' + encodeURIComponent(target.email) + '?subject=' +
    encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

  const where = how === 'shared' ? 'has been shared'
              : how === 'cancelled' ? 'was not saved — use “Download again” below'
              : 'has been saved to your Downloads folder';
  const m = modal(
    '<div class="mhead"><div><h2>Signing request ready</h2>' +
      '<p><b>' + S.esc(fname) + '</b> (' + kb + '&nbsp;KB) ' + where + '.</p></div>' +
      '<button class="x">×</button></div>' +
    '<div class="mbody">' +
      '<ol class="steplist">' +
        '<li>Click <b>Open Gmail</b> below — the message to ' + S.esc(target.name || target.email) +
          ' is already written, link included.</li>' +
        '<li><b>Attach</b> the signing‑request file to that message.</li>' +
        '<li>Send. They open the link on any device — phone included — load the file, sign, ' +
          'and send the finished PDF back to ' + S.esc(A.doc.sender.email || 'you') + '.</li>' +
      '</ol>' +
      '<div class="note info" style="margin-top:6px">The document travels in the attachment, not ' +
        'through the website — <b>' + S.esc(url) + '</b> only ever loads the blank app. ' +
        '<button class="linkish" id="seturl">Change this address</button></div>' +
    '</div>' +
    '<div class="mfoot">' +
      '<button class="btn ghost" id="again2">Download again</button>' +
      '<div class="spacer"></div>' +
      '<a class="btn" href="' + mailto + '">Default mail app</a>' +
      '<a class="btn primary" href="' + gmail + '" target="_blank" rel="noopener">Open Gmail →</a>' +
    '</div>');
  m.querySelector('#again2').onclick = () => buildPacket(target);
  m.querySelector('#seturl').onclick = () => {
    const v = prompt('Web address where Signet is published.\n' +
      'Signers open this to load the file you attach.', appUrl());
    if (v && /^https?:\/\//i.test(v.trim())){
      S.store.set('appurl', v.trim().replace(/\s+$/,''));
      m.remove(); showSendModal(target, fname, kb, how);
    } else if (v){ S.toast('That needs to start with https://'); }
  };
}

/* Where signers should go to open the attachment. Defaults to wherever this
   page is itself being served from, which is right once it is hosted; a
   file:// copy has no useful address, so fall back to the published one. */
const HOSTED_URL = '';
function appUrl(){
  const saved = S.store.get('appurl', null);
  if (saved) return saved;
  if (/^https?:$/i.test(location.protocol)) return location.origin + location.pathname.replace(/\/index\.html$/i, '/');
  return HOSTED_URL || '(publish Signet first — click “Change this address”)';
}

/* ---------------- sign it myself / export ---------------- */
async function exportNow(){
  const unfilled = A.doc.fields.filter(f => f.required && !S.hasValue(f));
  if (unfilled.length && !confirm(unfilled.length + ' required field(s) are still empty. Export anyway?')) return;
  S.toast('Building PDF…');
  try {
    const me = A.doc.signers.find(x => x.isMe);
    if (fieldsOf(me.id).some(S.hasValue) && !me.signedAt){
      me.signedAt = new Date().toISOString();
      me.agent = navigator.userAgent;
      me.name = A.doc.sender.name || 'Me';
      me.email = A.doc.sender.email || '';
    }
    const bytes = await S.buildSignedPdf(A.pdfBytes, A.doc);
    const how = await S.shareOrDownload(S.safeName(A.doc.title) + ' — signed.pdf',
      new Blob([bytes], {type: 'application/pdf'}), 'Signed: ' + A.doc.title);
    if (how !== 'cancelled') S.toast(how === 'shared' ? 'Signed PDF ready to send' : 'Signed PDF downloaded');
  } catch(e){ S.toast('Export failed: ' + e.message, 5000); }
}

function saveDraft(){
  const payload = JSON.stringify({v: 1, pdf: A.pdfB64, doc: A.doc});
  S.download(S.safeName(A.doc.title) + ' — draft.signet.json', new Blob([payload], {type: 'application/json'}));
  S.toast('Draft saved — reopen it from the start screen');
}

/* ---------------- page rendering ---------------- */
let renderGen = 0;
async function renderPages(){
  const gen = ++renderGen;
  const pagesEl = document.getElementById('pages');
  const stage = document.getElementById('stage');
  const avail = Math.min(stage.clientWidth - 60, 900);
  pagesEl.innerHTML = '';
  for (const p of A.geo){
    if (gen !== renderGen) return;          // a newer render superseded this one
    const wrap = document.createElement('div');
    wrap.className = 'pagewrap';
    wrap.dataset.page = p.num - 1;
    wrap.innerHTML = '<span class="pagenum">' + p.num + '</span>';
    const cv = document.createElement('canvas');
    wrap.appendChild(cv);
    const layer = document.createElement('div');
    layer.className = 'layer';
    layer.dataset.page = p.num - 1;
    wrap.appendChild(layer);
    pagesEl.appendChild(wrap);
    try { await S.renderPageTo(p.page, cv, Math.min(avail, p.w * 1.6)); }
    catch(err){ console.error('page ' + p.num + ' failed to render', err); }
    wrap.style.width = cv.style.width;
    layer.addEventListener('click', e => {
      if (e.target !== layer) return;
      if (A.armed && A.step === 2) place(A.armed, p.num - 1, e);
      else { A.sel = null; drawChrome(); }
    });
  }
  paintFields();
}

function bindResize(){
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(renderPages, 250); });
  // A tab that was in the background may have rendered only partially.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) renderPages();
  });
}

/* ---------------- field painting & interaction ---------------- */
function paintFields(){
  document.querySelectorAll('.layer').forEach(l => l.innerHTML = '');
  const me = A.doc.signers.find(s => s.isMe);
  for (const f of A.doc.fields){
    const layer = document.querySelector('.layer[data-page="' + f.page + '"]');
    if (!layer) continue;
    const s = signerOf(f.signer) || {color: '#888'};
    const filled = S.hasValue(f);
    const selfMode = (A.step === 3 && f.signer === me.id);
    const el = document.createElement('div');
    el.className = 'fld' + (f.id === A.sel ? ' sel' : '') + (filled ? ' filled' : '') +
                   (f.required && !filled ? ' req' : '') +
                   (selfMode && !filled ? ' todo' : '') +
                   (A.step === 3 && !selfMode ? ' other readonly' : '');
    el.style.cssText = 'left:' + (f.x*100) + '%;top:' + (f.y*100) + '%;width:' + (f.w*100) +
                       '%;height:' + (f.h*100) + '%;--fc:' + s.color;
    el.dataset.id = f.id;

    if (filled) el.innerHTML = valueHtml(f);
    else el.innerHTML = '<span class="cap">' + S.esc(f.label || S.TYPES[f.type].label) + '</span>';

    if (A.step === 2){
      el.innerHTML += '<span class="tag">' + S.esc(S.TYPES[f.type].label) + ' · ' +
        S.esc(s.isMe ? 'me' : (s.name || 'signer')) + '</span>' +
        '<span class="hdl"></span><button class="del" title="Delete">×</button>';
      bindFieldEdit(el, f);
    } else if (selfMode){
      el.addEventListener('click', () => selfFill(f));
    }
    layer.appendChild(el);
  }
}

function valueHtml(f){
  if (f.type === 'signature' || f.type === 'initials')
    return '<span class="val"><img src="' + S.esc(f.value) + '" alt=""></span>';
  if (f.type === 'check')
    return '<span class="val" style="justify-content:center;color:#0f1720;font-weight:700">✓</span>';
  return '<span class="val"><span>' + S.esc(f.value) + '</span></span>';
}

function bindFieldEdit(el, f){
  el.querySelector('.del').onclick = e => {
    e.stopPropagation();
    A.doc.fields = A.doc.fields.filter(x => x.id !== f.id);
    if (A.sel === f.id) A.sel = null;
    drawChrome();
  };
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('del')) return;
    e.preventDefault(); e.stopPropagation();
    A.sel = f.id;
    document.querySelectorAll('.fld').forEach(x => x.classList.toggle('sel', x === el));
    drawLeft(); drawRight();

    const resizing = e.target.classList.contains('hdl');
    const layer = el.parentElement;
    const r = layer.getBoundingClientRect();
    const x0 = e.clientX, y0 = e.clientY;
    const f0 = {x: f.x, y: f.y, w: f.w, h: f.h};
    el.classList.add('dragging');
    try { el.setPointerCapture(e.pointerId); } catch(_){}

    const move = ev => {
      const dx = (ev.clientX - x0) / r.width, dy = (ev.clientY - y0) / r.height;
      if (resizing){
        f.w = S.clamp(f0.w + dx, 0.012, 1 - f.x);
        f.h = S.clamp(f0.h + dy, 0.008, 1 - f.y);
      } else {
        f.x = S.clamp(f0.x + dx, 0, 1 - f.w);
        f.y = S.clamp(f0.y + dy, 0, 1 - f.h);
      }
      el.style.left = (f.x*100) + '%'; el.style.top = (f.y*100) + '%';
      el.style.width = (f.w*100) + '%'; el.style.height = (f.h*100) + '%';
    };
    const up = () => {
      el.classList.remove('dragging');
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ---------------- placing new fields ---------------- */
function place(type, pageIdx, ev){
  const layer = document.querySelector('.layer[data-page="' + pageIdx + '"]');
  const r = layer.getBoundingClientRect();
  const g = A.geo[pageIdx];
  const T = S.TYPES[type];
  const w = T.w / g.w, h = T.h / g.h;
  const x = S.clamp((ev.clientX - r.left) / r.width - w / 2, 0, 1 - w);
  const y = S.clamp((ev.clientY - r.top)  / r.height - h / 2, 0, 1 - h);
  const f = {
    id: S.uid('f'), signer: A.active, page: pageIdx,
    x: x, y: y, w: w, h: h,
    type: type, label: '', required: type !== 'text' && type !== 'check', value: null
  };
  A.doc.fields.push(f);
  A.sel = f.id;
  A.armed = null;
  drawChrome();
}

function bindToolDrag(btn){
  let ghost = null, moved = false, id = null;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    moved = false; id = e.pointerId;
    try { btn.setPointerCapture(id); } catch(_){}

    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < 5) return;
      if (!moved){
        moved = true;
        A.armed = btn.dataset.t;
        document.getElementById('stage').classList.add('arming');
        ghost = document.createElement('div');
        ghost.className = 'ghosttool';
        ghost.textContent = S.TYPES[btn.dataset.t].icon + '  ' + S.TYPES[btn.dataset.t].label;
        document.body.appendChild(ghost);
      }
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top = ev.clientY + 'px';
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (ghost){ ghost.remove(); ghost = null; }
      if (!moved){
        // plain click → arm / disarm. On a phone the tools live in a drawer that
        // covers the page, so get it out of the way before asking for a tap.
        A.armed = (A.armed === btn.dataset.t) ? null : btn.dataset.t;
        drawChrome();
        if (A.armed){
          closeDrawers();
          S.toast(S.TOUCH ? 'Now tap where it goes on the page'
                          : 'Now click where it goes on the page');
        }
        return;
      }
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const layer = under && under.closest ? under.closest('.layer') : null;
      if (layer){
        document.getElementById('stage').classList.remove('arming');
        place(btn.dataset.t, +layer.dataset.page, ev);
      } else {
        // Dropped off the page. Stay armed so the next click still places it.
        S.toast('Drop it on the document — or just click where it goes');
      }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ---------------- filling my own fields ---------------- */
function selfFill(f){
  if (f.type === 'check'){ f.value = !f.value; drawChrome(); return; }
  if (f.type === 'signature' || f.type === 'initials'){
    const saved = S.store.get('sig', null);
    if (saved && f.type === 'signature' && !f.value){ f.value = saved; drawChrome(); return; }
    openSignature(f.type, (url, remember) => {
      f.value = url;
      if (remember && f.type === 'signature') S.store.set('sig', url);
      drawChrome();
    });
    return;
  }
  const seed = f.value || (f.type === 'date' ? S.fmtDate() :
                           f.type === 'name'  ? (A.doc.sender.name || '') :
                           f.type === 'email' ? (A.doc.sender.email || '') : '');
  openPrompt(f.label || S.TYPES[f.type].label, seed, v => { f.value = v; drawChrome(); });
}

/* ---------------- shared modals (console copy) ---------------- */
function modal(html, wide){
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  document.body.appendChild(scrim);
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) scrim.remove(); });
  const onEsc = e => { if (e.key === 'Escape'){ scrim.remove(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);
  const x = scrim.querySelector('.x');
  if (x) x.onclick = () => scrim.remove();
  return scrim;
}

function openPrompt(label, seed, cb){
  const m = modal(
    '<div class="mhead"><div><h2>' + S.esc(label) + '</h2></div><button class="x">×</button></div>' +
    '<div class="mbody"><input class="inp" id="pv" value="' + S.esc(seed) + '"></div>' +
    '<div class="mfoot"><div class="spacer"></div><button class="btn" id="pc">Cancel</button>' +
    '<button class="btn primary" id="po">Apply</button></div>');
  const inp = m.querySelector('#pv');
  inp.focus(); inp.select();
  const ok = () => { const v = inp.value.trim(); m.remove(); if (v) cb(v); };
  m.querySelector('#po').onclick = ok;
  m.querySelector('#pc').onclick = () => m.remove();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
}

function openSignature(kind, cb){
  const isInit = kind === 'initials';
  const seed = isInit
    ? (A.doc.sender.name || '').split(/\s+/).map(w => w[0] || '').join('').slice(0,4).toUpperCase()
    : (A.doc.sender.name || '');
  const m = modal(
    '<div class="mhead"><div><h2>' + (isInit ? 'Your initials' : 'Your signature') + '</h2>' +
      '<p>Draw it, type it, or upload a photo. It is remembered only on this device.</p></div>' +
      '<button class="x">×</button></div>' +
    '<div class="mbody">' +
      '<div class="tabs"><button class="tab on" data-t="draw">Draw</button>' +
        '<button class="tab" data-t="type">Type</button>' +
        '<button class="tab" data-t="upload">Upload</button></div>' +
      '<div data-p="draw"><div class="padwrap"><canvas class="pad" id="pad"></canvas>' +
        '<div class="base"></div><div class="xmark">✕</div></div>' +
        '<div style="display:flex;margin-top:9px"><button class="btn ghost" id="clr">Clear</button></div></div>' +
      '<div data-p="type" class="hidden">' +
        '<input class="inp" id="tv" placeholder="Type your name" value="' + S.esc(seed) + '">' +
        '<div class="fonts" id="fonts"></div><div class="preview" id="tprev"></div></div>' +
      '<div data-p="upload" class="hidden">' +
        '<input type="file" accept="image/*" class="inp" id="uf">' +
        '<label class="chk" style="margin-top:11px"><input type="checkbox" id="ub" checked>' +
          'Remove the paper background</label>' +
        '<div class="preview" id="uprev"><span class="note">Photograph your signature on white paper</span></div></div>' +
    '</div>' +
    '<div class="mfoot">' +
      (isInit ? '' : '<label class="chk"><input type="checkbox" id="rem" checked>Remember on this device</label>') +
      '<div class="spacer"></div><button class="btn" id="cancel">Cancel</button>' +
      '<button class="btn primary" id="apply">Apply</button></div>', true);

  const pad = S.makePad(m.querySelector('#pad'));
  let tab = 'draw', typed = null, uploaded = null;
  m.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    tab = b.dataset.t;
    m.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    m.querySelectorAll('[data-p]').forEach(p => p.classList.toggle('hidden', p.dataset.p !== tab));
    if (tab === 'draw') pad.resize();
    if (tab === 'type') renderTyped();
  });
  m.querySelector('#clr').onclick = () => pad.clear();

  const FONTS = ['"Dancing Script",cursive', '"Great Vibes",cursive', '"Caveat",cursive',
                 '"Brush Script MT","Segoe Script",cursive'];
  let fi = 0;
  const fw = m.querySelector('#fonts');
  FONTS.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'fontpick' + (i === 0 ? ' on' : '');
    b.style.fontFamily = f; b.textContent = 'Abc';
    b.onclick = () => { fi = i; fw.querySelectorAll('.fontpick').forEach((x, j) => x.classList.toggle('on', j === i)); renderTyped(); };
    fw.appendChild(b);
  });
  function renderTyped(){
    typed = S.typedSignature(m.querySelector('#tv').value, FONTS[fi]);
    m.querySelector('#tprev').innerHTML = typed ? '<img src="' + typed + '" alt="">' :
      '<span class="note">Type your name above</span>';
  }
  m.querySelector('#tv').addEventListener('input', renderTyped);

  const uf = m.querySelector('#uf'), ub = m.querySelector('#ub');
  async function doUpload(){
    if (!uf.files || !uf.files[0]) return;
    uploaded = await S.cleanUpload(uf.files[0], ub.checked);
    m.querySelector('#uprev').innerHTML = '<img src="' + uploaded + '" alt="">';
  }
  uf.onchange = doUpload; ub.onchange = doUpload;

  m.querySelector('#cancel').onclick = () => m.remove();
  m.querySelector('#apply').onclick = () => {
    let out = tab === 'draw' ? pad.toDataURL() : tab === 'type' ? typed : uploaded;
    if (!out){ S.toast('Nothing to apply yet'); return; }
    const rem = m.querySelector('#rem');
    m.remove();
    cb(out, rem ? rem.checked : false);
  };
  setTimeout(() => pad.resize(), 30);
}

/* ---------------- keyboard ---------------- */
function bindKeys(){
  document.addEventListener('keydown', e => {
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'Escape'){ A.armed = null; A.sel = null; drawChrome(); return; }
    if (!A.sel || A.step !== 2) return;
    const f = fieldOf(A.sel);
    if (!f) return;
    if (e.key === 'Delete' || e.key === 'Backspace'){
      e.preventDefault();
      A.doc.fields = A.doc.fields.filter(x => x.id !== f.id);
      A.sel = null; drawChrome(); return;
    }
    const step = e.shiftKey ? 0.01 : 0.002;
    const map = {ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step]};
    if (map[e.key]){
      e.preventDefault();
      f.x = S.clamp(f.x + map[e.key][0], 0, 1 - f.w);
      f.y = S.clamp(f.y + map[e.key][1], 0, 1 - f.h);
      const el = document.querySelector('.fld[data-id="' + f.id + '"]');
      if (el){ el.style.left = (f.x*100) + '%'; el.style.top = (f.y*100) + '%'; }
    }
  });
}

renderStart();
})();
</script>
